<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRJ381 Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="Belgium Campus" class="brand-logo" />
      <div class="brand-info">
        <h1>Virtual Campus Open Day</h1>
        <span class="brand-subtitle">VR Analytics & Telemetry</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text" id="connection-status">Live</span>
      </div>
      <button id="btn-refresh" class="btn-refresh" title="Refresh data">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Refresh</span>
      </button>
    </div>
  </header>

  <main class="content">
    <section class="stats">
      <div class="card">
        <span class="card-label">Total Leads</span>
        <span class="card-value" id="stat-leads">—</span>
      </div>
      <div class="card">
        <span class="card-label">Analytics Events</span>
        <span class="card-value" id="stat-events">—</span>
      </div>
      <div class="card">
        <span class="card-label">Unique Sessions</span>
        <span class="card-value" id="stat-sessions">—</span>
      </div>
    </section>

    <section class="charts-grid">
      <div class="panel chart-panel">
        <h2>VR Event Breakdown</h2>
        <div class="chart-container">
          <canvas id="events-chart"></canvas>
        </div>
      </div>
      <div class="panel chart-panel">
        <h2>Campus Area Activity</h2>
        <div class="chart-container">
          <canvas id="area-chart"></canvas>
        </div>
      </div>
      <div class="panel chart-panel">
        <h2>Top Visited Hotspots</h2>
        <div class="chart-container">
          <canvas id="hotspot-chart"></canvas>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Recent Leads</h2>
      <table id="leads-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Hotspot</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          <!-- rows populated by js/app.js -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
