<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRJ381 Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>VR Campus Tour — Dashboard</h1>
  </header>

  <main class="content">
    <section class="stats">
      <div class="card">
        <span class="card-label">Total Leads</span>
        <span class="card-value" id="stat-leads">—</span>
      </div>
      <div class="card">
        <span class="card-label">Analytics Events</span>
        <span class="card-value" id="stat-events">—</span>
      </div>
      <div class="card">
        <span class="card-label">Unique Sessions</span>
        <span class="card-value" id="stat-sessions">—</span>
      </div>
    </section>

    <section class="panel chart-panel">
      <h2>VR Event Breakdown</h2>
      <div class="chart-container">
        <canvas id="events-chart"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Recent Leads</h2>
      <table id="leads-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Hotspot</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          <!-- rows populated by js/app.js -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
