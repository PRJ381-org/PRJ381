<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — PRJ381 Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card panel">
      <div class="login-brand">
        <img src="assets/logo.png" alt="Belgium Campus" class="brand-logo" />
        <div>
          <h1>Virtual Campus Open Day</h1>
          <span class="brand-subtitle">Admin Dashboard</span>
        </div>
      </div>

      <div id="login-error" class="error-banner" style="display: none;"></div>

      <button id="btn-ms-login" class="btn-ms-signin" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Sign in with Student Account</span>
      </button>
      <p id="ms-disabled-note" class="login-note" style="display: none;">
        Student account sign-in isn't set up yet — coming soon.
      </p>

      <div class="login-divider"><span>or</span></div>

      <form id="local-login-form" class="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />

        <button type="submit" class="btn-refresh login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
